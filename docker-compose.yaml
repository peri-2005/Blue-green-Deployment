# /docker-compose.yml
services:
  # 1. Backend Service
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000" # Maps local port 5000 to container port 5000
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://db:27017/myapp # Example DB string
    restart: always

  # 2. First Frontend Service (Client App)
  frontend-client:
    build:
      context: ./frontend-client
    ports:
      - "3000:80" # Accessible locally at http://localhost:3000
    restart: always
    depends_on:
      - backend # Ensures backend starts first

  # 3. Second Frontend Service (Admin Dashboard)
  frontend-admin:
    build:
      context: ./frontend-admin
    ports:
      - "3001:80" # Accessible locally at http://localhost:3001
    restart: always
    depends_on:
      - backend
